# Two Linux host containers bridge traffic in/out of K8s:
# lan1-host: on LAN1, traffic from Cluster 1
# lan2-host: on LAN2,  Cluster 2

# Deploy: sudo clab deploy -t frrlab.clab.yml
# Destroy: sudo clab destroy -t frrlab.clab.yml

name: pa3-wan

topology:
  nodes:
    # Backbone routers
    router1:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - router1/daemons:/etc/frr/daemons
        - router1/frr.conf:/etc/frr/frr.conf

    router2:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - router2/daemons:/etc/frr/daemons
        - router2/frr.conf:/etc/frr/frr.conf

    # Edge routers
    router3:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - router3/daemons:/etc/frr/daemons
        - router3/frr.conf:/etc/frr/frr.conf

    router4:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - router4/daemons:/etc/frr/daemons
        - router4/frr.conf:/etc/frr/frr.conf

    router5:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - router5/daemons:/etc/frr/daemons
        - router5/frr.conf:/etc/frr/frr.conf

    router6:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - router6/daemons:/etc/frr/daemons
        - router6/frr.conf:/etc/frr/frr.conf

    # Linux host on LAN1 side - bridges traffic between ContainerLab and K8s Cluster 1
    lan1-host:
      kind: linux
      image: wbitt/network-multitool:extra

    # Linux host on LAN2 side - bridges traffic between ContainerLab and K8s Cluster 2
    lan2-host:
      kind: linux
      image: wbitt/network-multitool:extra

  links:
    # R4 to R1 (cost 10)
    - endpoints: ["router4:eth1", "router1:eth1"]
    # R1 to R2 (cost 100)
    - endpoints: ["router1:eth2", "router2:eth1"]
    # R1 to R3 (cost 25)
    - endpoints: ["router1:eth3", "router3:eth1"]
    # R3 to R5 (cost 15)
    - endpoints: ["router3:eth2", "router5:eth1"]
    # R5 to R2 (cost 10)
    - endpoints: ["router5:eth2", "router2:eth2"]
    # R2 to R6 (cost 20)
    - endpoints: ["router2:eth3", "router6:eth1"]

    
    # LAN1: router4 to lan1-host (10.2.0.0/24)
    - endpoints: ["router4:eth2", "lan1-host:eth1"]
    # LAN2: router6 to lan2-host (10.4.0.0/24)
    - endpoints: ["router6:eth2", "lan2-host:eth1"]
