apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: team7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
    spec:
      containers:
      - name: analytics
        image: 192.168.1.129:5000/team7/analytics:latest
        ports:
        - containerPort: 5557
---
apiVersion: v1
kind: Service
metadata:
  name: analytics
  namespace: team7
spec:
  type: ClusterIP
  selector:
    app: analytics
  ports:
  - name: zmq
    port: 5557
    targetPort: 5557
