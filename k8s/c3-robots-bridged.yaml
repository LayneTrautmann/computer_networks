# Robot deployments configured to route through ContainerLab 2 (bridged LANs).
#
# Instead of pointing directly at C2 inventory (172.16.2.136), robots connect
# to the VM running the bridged LAN topology. Traffic enters at robot-party
# (BR5), traverses bridges to lan2-host (BR1), then exits to C2 inventory.
#
# Update VM2_IP below to match your ContainerLab 2 host.
# Apply on C3: kubectl apply -f k8s/c3-robots-bridged.yaml -n team7

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-bread
  namespace: team7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robot-bread
  template:
    metadata:
      labels:
        app: robot-bread
    spec:
      containers:
      - name: robot-bread
        image: 192.168.1.129:5000/team7/robot:latest
        command: ["python", "robot_service/robot.py", "bread"]
        env:
        - name: INVENTORY_SERVICE_HOST
          value: "172.16.5.8"
        - name: INVENTORY_SERVICE_PORT
          value: "30051"
        - name: ZMQ_SUB_ADDRESS
          value: "tcp://172.16.5.8:30556"
