apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-bread
  namespace: team7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robot-bread
  template:
    metadata:
      labels:
        app: robot-bread
    spec:
      containers:
      - name: robot-bread
        image: 192.168.1.129:5000/team7/robot:latest
        command: ["python", "robot_service/robot.py", "bread"]
        env:
        - name: INVENTORY_SERVICE_HOST
          value: "172.16.2.136"
        - name: INVENTORY_SERVICE_PORT
          value: "30051"
        - name: ZMQ_SUB_ADDRESS
          value: "tcp://172.16.2.136:30556"
---
