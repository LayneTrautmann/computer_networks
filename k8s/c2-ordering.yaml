apiVersion: apps/v1
kind: Deployment
metadata:
  name: ordering
  namespace: team7
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ordering
  template:
    metadata:
      labels:
        app: ordering
    spec:
      containers:
      - name: ordering
        image: 192.168.1.129:5000/team7/ordering:latest
        ports:
        - containerPort: 5000
        env:
        - name: INVENTORY_SERVICE_HOST
          value: "inventory"
        - name: INVENTORY_SERVICE_PORT
          value: "50051"
        - name: ZMQ_ANALYTICS_ADDRESS
          value: "tcp://analytics:5557"
---
apiVersion: v1
kind: Service
metadata:
  name: ordering
  namespace: team7
spec:
  type: NodePort
  selector:
    app: ordering
  ports:
  - name: http
    port: 5000
    targetPort: 5000
    nodePort: 30500
