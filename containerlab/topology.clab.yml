# ContainerLab WAN Emulation Topology
#
# Architecture:
#   External traffic enters vm1 via socat on port 30500
#   -> wan-router (Alpine, applies tc-netem WAN delay on eth1)
#   -> proxy (nginx, forwards to C2 ordering service)
#
# Deploy:   sudo clab deploy -t topology.clab.yml
# Destroy:  sudo clab destroy -t topology.clab.yml
# Inspect:  sudo clab inspect -t topology.clab.yml

name: grocery-wan

topology:
  nodes:
    # WAN router: applies tc-netem delay on eth1 (the link to proxy)
    wan-router:
      kind: linux
      image: alpine:latest
      exec:
        - sysctl -w net.ipv4.ip_forward=1

    # Proxy: nginx reverse proxy that forwards traffic to C2 ordering service
    proxy:
      kind: linux
      image: nginx:alpine
      exec:
        - sh -c "printf 'server {\n  listen 5000;\n  location / {\n    proxy_pass http://172.16.2.136:30500;\n  }\n}\n' > /etc/nginx/conf.d/ordering.conf && nginx -g 'daemon off;' &"

  links:
    # Internal link between wan-router and proxy (tc-netem applied here)
    - endpoints: ["wan-router:eth1", "proxy:eth1"]
