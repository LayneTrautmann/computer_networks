# ContainerLab WAN Emulation Topology
#
# Architecture:
#   vm1 socat (port 30500) -> wan-router container (tc-netem on eth1) -> proxy container -> C2:30500
#
# After deploying, run start-wan.sh to start socat processes and apply tc-netem.
#
# Deploy:   sudo clab deploy -t topology.clab.yml
# Destroy:  sudo clab destroy -t topology.clab.yml
# Inspect:  sudo clab inspect -t topology.clab.yml

name: grocery-wan

topology:
  nodes:
    # WAN router: tc-netem delay applied on eth1 after deploy via configure-wan.sh
    wan-router:
      kind: linux
      image: alpine:latest
      exec:
        - sysctl -w net.ipv4.ip_forward=1
        - apk add -q socat iproute2

    # Proxy: forwards traffic out to C2 ordering service
    proxy:
      kind: linux
      image: alpine:latest
      exec:
        - apk add -q socat

  links:
    # Internal link: wan-router:eth1 <-> proxy:eth1 (tc-netem applied on wan-router:eth1)
    - endpoints: ["wan-router:eth1", "proxy:eth1"]
