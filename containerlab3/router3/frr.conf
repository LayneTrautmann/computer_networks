# Connections:
#   eth1 -> router1 (cost 30, alternate edge)
#
frr version 10.5
!
frr defaults traditional
!
hostname router3
!
no ipv6 forwarding
!
log syslog informational
!
interface eth1
  ip address 10.1.13.3/24
  ip ospf cost 30
!
interface lo
  ip address 10.254.0.3/32
  ip ospf passive
!
router ospf
 ospf router-id 10.254.0.3
 network 10.1.13.0/24 area 0.0.0.0
!
