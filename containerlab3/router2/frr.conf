# Connections:
#   eth1 -> router1 (cost 80, expensive direct)
#   eth2 -> router5 (cost 15, cross link)
#   eth3 -> router6 (cost 25)
#
frr version 10.5
!
frr defaults traditional
!
hostname router2
!
no ipv6 forwarding
!
log syslog informational
!
interface eth1
  ip address 10.1.12.2/24
  ip ospf cost 80
!
interface eth2
  ip address 10.1.52.2/24
  ip ospf cost 15
!
interface eth3
  ip address 10.1.26.2/24
  ip ospf cost 25
!
interface lo
  ip address 10.254.0.2/32
  ip ospf passive
!
router ospf
 ospf router-id 10.254.0.2
 network 10.1.12.0/24 area 0.0.0.0
 network 10.1.52.0/24 area 0.0.0.0
 network 10.1.26.0/24 area 0.0.0.0
!
