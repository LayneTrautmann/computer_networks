# Backup WAN ContainerLab topology (PA4 Milestone 3)
# C1 clients (LAN1, 10.6.0.0/24) -> OSPF routers -> C3 backup cluster (LAN2, 10.8.0.0/24)
# Topology: different graph from containerlab1 with same number of routers
#
# Shortest path: R4->R1->R5->R2->R6, cost = 10+20+15+25 = 70
# Direct path:   R4->R1->R2->R6,     cost = 10+80+25    = 115
#
# Deploy: sudo clab deploy -t frrlab-backup.clab.yml
# Destroy: sudo clab destroy -t frrlab-backup.clab.yml

name: pa4-backup-wan

topology:
  nodes:
    # Backbone routers
    router1:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - router1/daemons:/etc/frr/daemons
        - router1/frr.conf:/etc/frr/frr.conf

    router2:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - router2/daemons:/etc/frr/daemons
        - router2/frr.conf:/etc/frr/frr.conf

    # Edge routers
    router3:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - router3/daemons:/etc/frr/daemons
        - router3/frr.conf:/etc/frr/frr.conf

    router4:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - router4/daemons:/etc/frr/daemons
        - router4/frr.conf:/etc/frr/frr.conf

    router5:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - router5/daemons:/etc/frr/daemons
        - router5/frr.conf:/etc/frr/frr.conf

    router6:
      kind: linux
      image: quay.io/frrouting/frr:10.5.1
      binds:
        - router6/daemons:/etc/frr/daemons
        - router6/frr.conf:/etc/frr/frr.conf

    # Linux host on LAN1 side - bridges traffic from K8s Cluster 1
    lan1-host:
      kind: linux
      image: wbitt/network-multitool:extra

    # Linux host on LAN2 side - bridges traffic to K8s Cluster 3 (backup)
    lan2-host:
      kind: linux
      image: wbitt/network-multitool:extra

  links:
    # R4 to R1 (cost 10)
    - endpoints: ["router4:eth1", "router1:eth1"]
    # R1 to R2 (cost 80, expensive direct backbone)
    - endpoints: ["router1:eth2", "router2:eth1"]
    # R1 to R5 (cost 20, cheaper via R5)
    - endpoints: ["router1:eth3", "router5:eth1"]
    # R5 to R2 (cost 15, cross link)
    - endpoints: ["router5:eth2", "router2:eth2"]
    # R3 to R1 (cost 30, alternate edge)
    - endpoints: ["router3:eth1", "router1:eth4"]
    # R2 to R6 (cost 25)
    - endpoints: ["router2:eth3", "router6:eth1"]

    # LAN1: router4 to lan1-host (10.6.0.0/24)
    - endpoints: ["router4:eth2", "lan1-host:eth1"]
    # LAN2: router6 to lan2-host (10.8.0.0/24)
    - endpoints: ["router6:eth2", "lan2-host:eth1"]
